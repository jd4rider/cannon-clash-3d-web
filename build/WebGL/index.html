<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- This MUST be a static tag. The stock Unity template injects it from
         JavaScript, and iOS Safari ignores a viewport meta that is added after the
         document has loaded -- so the page laid out at its default 980px width and
         the game rendered as a small wide box instead of filling the phone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Unity Web Player | Cannon Clash 3D</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Gameplay is a single tap on the arena: no pinch-zoom, no double-tap zoom,
         no rubber-band scrolling stealing the first touch. */
      #unity-canvas { touch-action: none; }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Cannon Clash 3D</div>
      </div>
    </div>
    <script>
      let container = document.querySelector("#unity-container");
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",

        fullscreenElementID: "unity-fullscreen-container",

        companyName: "Little Joy Arcade",
        productName: "Cannon Clash 3D",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      // ---------------------------------------------------------------------
      // Portrait-only layout.
      //
      // This used to branch on the user-agent string and, when the regex did not
      // match (iPadOS reports a desktop "Macintosh" UA, as does any phone using
      // "Request Desktop Site"), fell back to a fixed 960x600 landscape box.
      // The squashed 960x600 canvas also shrank the UI reference height, which is
      // what pushed the main-menu buttons up over the title.
      //
      // The game is authored portrait-only (reference resolution 1080x1920), so:
      //   - viewport is portrait  -> canvas fills it exactly;
      //   - viewport is landscape -> game is letterboxed into a centred 9:16 panel
      //     rather than being rendered wide.
      // ---------------------------------------------------------------------
      var PORTRAIT_ASPECT = 9 / 16;

      container.className = "unity-mobile";
      canvas.className = "unity-mobile";

      function viewportSize() {
        // visualViewport tracks the real visible area on iOS, where the toolbars
        // grow and shrink innerHeight as you scroll.
        var vv = window.visualViewport;
        return {
          w: Math.round(vv ? vv.width : window.innerWidth),
          h: Math.round(vv ? vv.height : window.innerHeight)
        };
      }

      function layoutCanvas() {
        var size = viewportSize();
        var vw = size.w;
        var vh = size.h;
        if (vw <= 0 || vh <= 0) return;

        var w = vw;
        var h = vh;

        if (vw > vh) {
          // Landscape: render the portrait game centred instead of stretching it.
          w = Math.round(vh * PORTRAIT_ASPECT);
          h = vh;
        }

        container.style.width = w + 'px';
        container.style.height = h + 'px';
        container.style.left = Math.round((vw - w) / 2) + 'px';
        container.style.top = Math.round((vh - h) / 2) + 'px';
      }

      layoutCanvas();
      window.addEventListener('resize', layoutCanvas);
      window.addEventListener('orientationchange', layoutCanvas);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', layoutCanvas);
        window.visualViewport.addEventListener('scroll', layoutCanvas);
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
